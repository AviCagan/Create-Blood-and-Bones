plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://maven.createmod.net" }              // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" }     // Registrate
    maven { url = "https://maven.ryanhcode.dev/releases" }     // Sable, Sable Companion
    maven { url = "https://maven.blamejared.com" }             // Veil (Sable dependency)
    maven { url = "https://maven.dragons.plus/releases" }      // Create Enchantment Industry, Create: Dragons Plus
    exclusiveContent {
        forRepository { maven { url = "https://maven.fallenbreath.me/releases" } } // Conditional Mixin, runtime dependency of the Dragons Plus mods
        filter { includeGroup "me.fallenbreath" }
    }
    exclusiveContent {
        forRepository { maven { url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
    exclusiveContent {
        forRepository { maven { url = "https://maven.parchmentmc.org/" } }
        filter { includeGroup "org.parchmentmc.data" }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // pass -Dbloodandbones.debug.* switches from the gradle command line into the test server
            System.getProperties().each { k, v -> if (k.toString().startsWith('bloodandbones.debug.')) systemProperty k.toString(), v.toString() }
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// localRuntime: present in dev runs but not published as a dependency of this mod (MDK convention)
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // --- Create 6.0.11 and the libs its published pom/module requires ---
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")

    // --- Sable (physics) ---
    implementation("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}")
    implementation("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}")

    // --- Create addons this mod builds on ---
    implementation("plus.dragons.createenchantmentindustry:create-enchantment-industry-${minecraft_version}:${cei_version}")
    implementation("plus.dragons.createdragonsplus:create-dragons-plus-${minecraft_version}:${cdp_version}")
    implementation("maven.modrinth:create-diesel-generators:${cdg_version}")

    // JEI: compile against the API, run with the full mod (optional at runtime)
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    // Dev-runtime only: not dependencies of the mod, just useful in the test client
    runtimeOnly("maven.modrinth:cubes-without-borders:${cubes_without_borders_version}")
    runtimeOnly("maven.modrinth:create-aeronautics:${create_aeronautics_version}")

    // Apply Create's *published* access transformers to the dev-time Minecraft jar (MDG "accessTransformers"
    // configuration, see ModDevGradle README "Access Transformers"). Create publishes them as the
    // 'accesstransformer' classifier / accessTransformersElements variant of its maven artifact.
    // At runtime FML applies Create's own AT from its jar, so members widened there are usable by addons.
    accessTransformers("com.simibubi.create:create-${minecraft_version}:${create_version}")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            create_version_range   : create_version_range,
            flywheel_version_range : flywheel_version_range,
            sable_version          : sable_version,
            cei_version            : cei_version,
            cdp_version            : cdp_version,
            cdg_version            : cdg_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.main.resources.exclude '.cache/**'
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
